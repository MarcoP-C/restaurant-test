<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurante - Menú</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Header -->
    <header>
        <div class="header-content">
            <button class="hamburger" id="hamburger" aria-label="Toggle menu">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <h1 class="logo">🍔 RESTAURANTE</h1>
            <nav class="nav-menu" id="navMenu">
                <ul class="nav-list">
                    <li><a href="#products" class="nav-link active">Productos</a></li>
                    <li><a href="#promotions" class="nav-link">Promociones</a></li>
                </ul>
            </nav>
            <button class="theme-toggle" id="themeToggle" aria-label="Cambiar tema">
                <span class="theme-icon">🌙</span>
            </button>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="hero">
        <h2>Bienvenido a nuestro restaurante</h2>
        <p>Los mejores platillos de la ciudad</p>
    </section>

    <!-- Promotions Section -->
    <section id="promotions" class="promotions-section">
        <h2>🎉 Promociones</h2>
        <div class="promotions-container" id="promotionsContainer">
            <p class="loading">Cargando promociones...</p>
        </div>
    </section>

    <!-- Categories Section -->
    <section id="products" class="products-section">
        <div class="section-header">
            <h2>🍽️ Nuestros Productos</h2>
            <div class="category-filter">
                <select id="categoryFilter" aria-label="Filtrar por categoría">
                    <option value="">Todas las categorías</option>
                </select>
            </div>
        </div>
        <div class="products-grid" id="productsContainer">
            <p class="loading">Cargando productos...</p>
        </div>
    </section>

    <!-- Product Modal -->
    <div class="modal" id="productModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal-content">
            <div class="modal-close" id="modalClose" aria-label="Cerrar">×</div>
            <div id="modalBody">
                <!-- Content loaded dynamically -->
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <p>© 2026 Restaurante. Todos los derechos reservados.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
